info:
  name: Index
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}patients?page=3"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "3"
      type: query
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

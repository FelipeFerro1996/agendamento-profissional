info:
  name: Index
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}patients?page=1&name=Feli&nao_paginar=true"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: name
      value: Feli
      type: query
    - name: nao_paginar
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
